name: Deploy pull request previews

# Publishes the site of each pull request, drafts included, at
# https://opencollective.github.io/engineering-reports/pr-preview/pr-<number>/ and removes it when
# the pull request closes. Pull requests from forks get no preview (their token cannot push).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: github.event.action != 'closed'
        run: npm run preview
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
